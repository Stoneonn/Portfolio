# Tells Bing to re-crawl after a deploy that changed page content.
#
# Runs on pushes to main that touch the site or the sub-app. The sleep gives
# Vercel time to finish building and promote the deployment — IndexNow asks Bing
# to come and fetch, so pinging before the new build is live would just have it
# re-read the old page.
#
# Safe to re-run by hand from the Actions tab (workflow_dispatch).
name: IndexNow

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'designweek/**'
      - 'vercel.json'
  workflow_dispatch:

# Only the newest deploy matters; cancel a ping that is still waiting.
concurrency:
  group: indexnow
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Wait for the Vercel deploy to go live
        run: sleep 120

      - name: Confirm the deployed page is the new one
        run: |
          curl -fsS -o /dev/null -w 'sitemap %{http_code}\n' https://www.otaskaya.me/sitemap.xml
          curl -fsS https://www.otaskaya.me/ | grep -q 'id="root"><' \
            || { echo "prerendered HTML not found on the live site; not pinging"; exit 1; }

      - name: Submit URLs to IndexNow
        run: node site/scripts/indexnow.mjs
