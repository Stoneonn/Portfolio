<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0e1a" />
    <!--
      Sets .js before first paint so the scroll-reveal rules in global.css can
      hide content only when there is JavaScript to reveal it again. The page is
      prerendered, so without this a no-JS visitor gets a page of opacity:0.
    -->
    <script>
      document.documentElement.classList.add('js')
    </script>
    <title>Ömer Taşkaya — Economics at Bocconi, AI, photography</title>
    <meta
      name="description"
      content="Ömer Taşkaya — one page, one day, first light to first light: economics at Bocconi, AI, photographs, acid techno, and a dusk by Aivazovsky."
    />
    <link rel="canonical" href="https://www.otaskaya.me/" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.otaskaya.me/" />
    <meta property="og:site_name" content="Ömer Taşkaya" />
    <meta property="og:title" content="Ömer Taşkaya" />
    <meta
      property="og:description"
      content="One page, one day — first light to first light. Economics, AI, photographs, acid techno, and a dusk by Aivazovsky."
    />
    <meta property="og:image" content="https://www.otaskaya.me/paintings/dusk-on-the-golden-horn.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- All faces are self-hosted; see @font-face in src/styles/global.css. -->
    <link rel="preload" href="/fonts/Canela-Medium.ttf" as="font" type="font/ttf" crossorigin />

      type="font/woff2"
      crossorigin
    />
  </head>

</html>
