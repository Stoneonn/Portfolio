    <!--seo:body:start--><noscript><div style="max-width:900px;margin:0 auto;padding:48px 24px;background:#0a0a0a;color:#f2f2ea;font-family:'Inter',system-ui,sans-serif">
<p style="margin:0;color:#ccff00;font-weight:700"><a href="https://www.otaskaya.me" style="color:#ccff00;text-decoration:none">Ömer’s</a></p>
<h1 style="font-size:clamp(2.5rem,8vw,4rem);font-weight:800;letter-spacing:-.03em;margin:.1em 0 .3em">MDW 2026 Guide</h1>
<p style="max-width:40rem;color:#c7cbb8;margin:0 0 8px">A personal selection for Milan Design Week 2026 — 30 exhibitions and events across Milano, with venues, dates, and links.</p>
<ul style="list-style:none;padding:0;margin:32px 0 0"><li style="padding:20px 0;border-top:1px solid #2a2a2a"><a href="https://www.alcova.xyz/exhibitions/milano-2026" style="color:#ccff00;text-decoration:none;font-size:20px;font-weight:800">Alcova Milano</a><div style="margin-top:4px;color:#8a8a7a;font-size:12px;text-transform:uppercase;letter-spacing:.06em">April 20-26 2026 · Baggio Military Hospital (Via Giovanni Labus 10)</div><p style="margin:6px 0 0;color:#c7cbb8;font-size:14px">Tickets €12 (students €7, kids under 9 free). Open 11 AM - 7 PM. Over 110 exhibitors.</p></li><li style="padding:20px 0;border-top:1px solid #2a2a2a"><a href="https://dice.fm/event/53b2gy-crx-festival-23rd-apr-club-giovanile-milano-milano-tickets" style="color:#ccff00;text-decoration:none;font-size:20px;font-weight:800">CRX Festival</a><div style="margin-top:4px;color:#8a8a7a;font-size:12px;text-transform:uppercase;letter-spacing:.06em">April 23 2026 · Club Giovanile Milano (via Antonio Raimondi 15)</div><p style="margin:6px 0 0;color:#c7cbb8;font-size:14px">Free entry with RSVP. Free T-shirt. Time: 18:00 - 2:00.</p></li><li style="padding:20px 0;border-top:1px solid #2a2a2a"><a href="https://casaornella.com/casaornella-milano/" style="color:#ccff00;text-decoration:none;font-size:20px;font-weight:800">Casaornella Animale Sociale</a><div style="margin-top:4px;color:#8a8a7a;font-size:12px;text-transform:uppercase;letter-spacing:.06em">April 20-26 2026 · Via Conca del Naviglio 10</div><p style="margin:6px 0 0;color:#c7cbb8;font-size:14px">"Animale Sociale – Nessuno mi può giudicare" explores the balance between connection and protection in contemporary urban life.</p></li><li style="padding:20px 0;border-top:1px solid #2a2a2a"><a href="https://5vie.it/dna-home/48351/5vie-design-week-2026-qot-qualia-of-things/?lan=en" style="color:#ccff00;text-decoration:none;font-size:20px;font-weight:800">5 Vie Qualia of Things (QoT)</a><div style="margin-top:4px;color:#8a8a7a;font-size:12px;text-transform:uppercase;letter-spacing:.06em">April 20-26 2026 · Via Cesare Correnti 14</div><p style="margin:6px 0 0;color:#c7cbb8;font-size:14px">The concept shifts focus from the Internet of Things (IoT) to how objects engage our senses and create unique emotional experiences.</p></li><li style="padding:20px 0;border-top:1px solid #2a2a2a"><a href="https://nova.acdf.uz/programs/14" style="color:#ccff00;text-decoration:none;font-size:20px;font-weight:800">When Apricots Blossom</a><div style="margin-top:4px;color:#8a8a7a;font-size:12px;text-transform:uppercase;letter-spacing:.06em">April 20-26 2026 · Palazzo Citterio (Via Brera 12)</div><p style="margin:6px 0 0;color:#c7cbb8;font-size:14px">Immersive exhibition exploring crafts and culture of Karakalpakstan and the Aral Sea region, curated by architect Kulapat Yantrasast.</p></li><li style="padding:20px 0;border-top:1px solid #2a2a2a"><a href="https://design.superstudioevents.com/en/supernova/" style="color:#ccff00;text-decoration:none;font-size:20px;font-weight:800">Superstudio Più - SuperNova</a><div style="margin-top:4px;color:#8a8a7a;font-size:12px;text-transform:uppercase;letter-spacing:.06em">April 20-26 2026 · Via Tortona 27 bis</div><p style="margin:6px 0 0;color:#c7cbb8;font-size:14px">Features immersive installations and site-specific projects from global design brands, including a 1,000 sqm installation by Marcel Wanders for Moooi.</p></li><li style="padding:20px 0;border-top:1px solid #2a2a2a"><a href="https://living.corriere.it/salone-del-mobile/fuorisalone/fuorisalone-2026-cosa-vedremo-in-via-tortona-e-dintorni/" style="color:#ccff00;text-decoration:none;font-size:20px;font-weight:800">Sara Ricciardi Studio - Corpografia Paesaggio di Donna</a><div style="margin-top:4px;color:#8a8a7a;font-size:12px;text-transform:uppercase;letter-spacing:.06em">April 20-26 2026 · Via Tortona 25</div><p style="margin:6px 0 0;color:#c7cbb8;font-size:14px">Immersive sensory space functioning as a laboratory with ceramic surfaces that create emotional landscapes and narratives.</p></li><li style="padding:20px 0;border-top:1px solid #2a2a2a"><a href="https://base.milano.it/en/series/design-week-2026/" style="color:#ccff00;text-decoration:none;font-size:20px;font-weight:800">We Will Design - Hello Darkness</a><div style="margin-top:4px;color:#8a8a7a;font-size:12px;text-transform:uppercase;letter-spacing:.06em">April 20-26 2026 · Base Milano</div><p style="margin:6px 0 0;color:#c7cbb8;font-size:14px">Positions darkness as a fertile condition for possibility and imagination, featuring exhibitions, installations, and designer residencies.</p></li><li style="padding:20px 0;border-top:1px solid #2a2a2a"><a href="https://www.geberit.com/en/milan-design-week" style="color:#ccff00;text-decoration:none;font-size:20px;font-weight:800">Geberit - Flow.Form.Function.</a><div style="margin-top:4px;color:#8a8a7a;font-size:12px;text-transform:uppercase;letter-spacing:.06em">April 20-26 2026 · Opificio 31 (Via Tortona 31)</div><p style="margin:6px 0 0;color:#c7cbb8;font-size:14px">Features the RŌS installation by Atelier oï with stainless-steel springs guiding water droplets, part of the new Geberit Experience Center.</p></li><li style="padding:20px 0;border-top:1px solid #2a2a2a"><a href="https://www.adidesignmuseum.org/en/events/adi-design-week-2026/" style="color:#ccff00;text-decoration:none;font-size:20px;font-weight:800">ADI Design Week</a><div style="margin-top:4px;color:#8a8a7a;font-size:12px;text-transform:uppercase;letter-spacing:.06em">April 20-26 2026 · ADI Design Museum (Piazza Compasso d'Oro 1)</div><p style="margin:6px 0 0;color:#c7cbb8;font-size:14px">Features the XXIX Edition of the Compasso d'Oro, a solo show by Haruka Misawa ('Bit by Bit'), and an installation by Mario Botta inspired by Le Corbusier.</p></li><li style="padding:20px 0;border-top:1px solid #2a2a2a"><a href="https://www.instagram.com/p/DW6XvhcDCMj/" style="color:#ccff00;text-decoration:none;font-size:20px;font-weight:800">Futura (Cu
