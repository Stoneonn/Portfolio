<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- A 404 should never be indexed, however it is reached. -->
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#0a0e1a" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>04:04 — Ömer Taşkaya</title>
    <!--
      Served by Vercel for any unmatched path, so it is deliberately standalone:
      no bundle, no Tailwind, no JavaScript. Only the two self-hosted fonts the
      rest of the site already caches, so this costs a returning visitor nothing.

      The site is a clock, so a 404 gets an hour like everything else. 04:04 is
      the deep-night keyframe from src/engine/day.ts — zenith #0A0E1A, mid
      #101828, acid accent.
    -->
    <style>
      @font-face {
        font-family: 'Canela';
        src: url('/fonts/Canela-Medium.ttf') format('truetype');
        font-weight: 500;
        font-display: swap;
      }
      @font-face {
        font-family: 'IBM Plex Mono';
        src: url('/fonts/plex-mono-latin.woff2') format('woff2');
        font-weight: 400;
        font-display: swap;
        unicode-range: U+0000-00FF, U+0131, U+2000-206F, U+2192, U+2212, U+2215;
      }
      @font-face {
        font-family: 'IBM Plex Mono';
        src: url('/fonts/plex-mono-latin-ext.woff2') format('woff2');
        font-weight: 400;
        font-display: swap;
        unicode-range: U+0100-017F, U+2020, U+20A0-20C0;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding: clamp(1.5rem, 6vw, 5rem);
        background: linear-gradient(to bottom, #0a0e1a 0%, #101828 52%, #16203a 100%);
        color: #d9dce4;
        font-family: Inter, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .stamp {
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-size: 0.68rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #ccff00;
        margin-bottom: 1.25rem;
      }

      h1 {
        font-family: Canela, 'Times New Roman', serif;
        font-weight: 500;
        font-size: clamp(2.6rem, 11vw, 7rem);
        line-height: 0.94;
        letter-spacing: -0.015em;
        margin-bottom: 1.25rem;
      }

      p {
        font-size: clamp(1rem, 2.2vw, 1.2rem);
        line-height: 1.5;
        color: #8a93a5;
        max-width: 34ch;
        margin-bottom: 2.5rem;
      }

      a {
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-size: 0.72rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #d9dce4;
        text-decoration: none;
        border-bottom: 1px solid rgba(217, 220, 228, 0.28);
        padding-bottom: 0.35rem;
        align-self: flex-start;
        transition: color 0.3s, border-color 0.3s;
      }
      a:hover,
      a:focus-visible {
        color: #ccff00;
        border-color: #ccff00;
      }
      a:focus-visible {
        outline: 2px solid #ccff00;
        outline-offset: 6px;
      }

      @media (prefers-reduced-motion: reduce) {
        a {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <p class="stamp">04:04</p>
    <h1>Nothing here</h1>
    <p>This page isn’t part of the day. The hour you were looking for may have moved.</p>
    <a href="/">← Back to 05:41</a>
  </body>
</html>
